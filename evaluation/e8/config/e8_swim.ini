[General]

# ============================================================
# E8: Controlled comparative evaluation configuration
# B0 Rule-based
# B1 LLM-only
# B2 LLM + runtime RAG
# B3 Full agentic architecture
# ============================================================

scheduler-class = "cSocketRTScheduler"
num-rngs = 3

# ------------------------------------------------------------
# Results
# Keep E8 results separate from earlier SWIM experiments.
# ------------------------------------------------------------

output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca

outputscalarmanager-class = "omnetpp::envir::SqliteOutputScalarManager"
outputvectormanager-class = "omnetpp::envir::SqliteOutputVectorManager"

*.initialServers.param-record-as-scalar = true
*.maxServers.param-record-as-scalar = true
*.bootDelay.param-record-as-scalar = true
*.numberOfBrownoutLevels.param-record-as-scalar = true
*.evaluationPeriod.param-record-as-scalar = true
*.responseTimeThreshold.param-record-as-scalar = true
*.maxServiceRate.param-record-as-scalar = true

network = SWIM
result-dir = ../../../results/E8

# ------------------------------------------------------------
# Canonical E8 workload
# ------------------------------------------------------------

*.source.interArrivalsFile = "traces/wc_day53-highload-long.delta"

# The trace contains approximately 487.012 seconds of workload.
# SWIM remains available for at most 480 seconds.
# The E8 harness will use a fixed 420-second evaluation window.
sim-time-limit = 480s

# E8 evaluates overload behavior from the beginning of the run.
warmup-period = 0s

# ------------------------------------------------------------
# Common adaptation/QoS configuration
# ------------------------------------------------------------

*.evaluationPeriod = 60

*.numberOfBrownoutLevels = 5
*.dimmerMargin = 0.1
*.responseTimeThreshold = 0.75s

# ------------------------------------------------------------
# Canonical initial resource state
# ------------------------------------------------------------

*.maxServers = 6
*.initialServers = 1

# ------------------------------------------------------------
# Server configuration
#
# brownoutFactor = 0.1 corresponds to initial dimmer = 0.90.
# ------------------------------------------------------------

**.server*.server.threads = 100
**.server*.server.brownoutFactor = 0.1
**.server*.server.timeout = 10s

# No server boot delay in the canonical E8 experiment.
*.bootDelay = 0

# ------------------------------------------------------------
# Service-time model
# ------------------------------------------------------------

**.server*.server.serviceTime = truncnormal(0.030s,0.030s)
**.server*.server.lowFidelityServiceTime = truncnormal(0.001s,0.001s)

*.maxServiceRate = 1 / 0.04452713

# ------------------------------------------------------------
# Paired stochastic repetitions
#
# B0, B1, B2, and B3 will use the same run number/seed for each
# corresponding repetition.
# ------------------------------------------------------------

repeat = 5
seed-set = ${repetition}


[Config e8]
